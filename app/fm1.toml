# A22's build settings for fm1-base's tools/build.py (../build.sh runs it; the keys are explained at its top)
name = "a22"                   # names the build's files: app/build/a22.fwsc, a22-X.Y.Z.fwsc
id_prefix = "FM-1_4122"        # A22's own package identity: dev builds FM-1_412200, releases FM-1_4122XXYYZZ
usb_manufacturer = "A22"
usb_product = "A22 FM-1"
# the core is the DSP and the drawing: separate units at -O2
o2 = ["../core/*.c"]
o2_cflags = ["-DH1_DEVICE=1"]
words = "words.tsv"
# one SRAM budget for RAM code, .data/.bss and the pool (base/device/app_packed.ld): h1's pool is big (the
# framebuffer and its copy, the echo, the reverb, the string lines) and its .data/.bss small
ram_layout = "packed"
# app/hw/panel.h asks the panel's SPI whether a transfer is done (the BSP can only wait for it): the one
# place h1 reads a register, kept apart so the build's register check holds for the rest of the app
vendored = ["hw/"]
# The second core takes every other voice (app.c). Some FM-1s misread memory on the second core; with the
# fallback, one that does goes on with one core until it is switched off, instead of restarting.
# FM1B_CPU2=0 ./build.sh makes the build without the second core (CI keeps both).
cpu2 = true
cpu2_fallback = true
# Each audio half is rendered into a buffer of its own and copied into the DMA's half only while that half is still
# free. Without it the render wrote straight into the half: one that ran late was played while it still held the
# samples before MASTER (app_render scales them after h1_render), a full-level tear whatever MASTER was set to.
# A late half now leaves the one before playing whole. 2 KiB of RAM.
audio_aside = true
ble = false
# OCT- and OCT+ held: the USB port as a host for a USB-MIDI keyboard or synth (powered hub or adapter: the FM-1 gives
# the port no power). Boot is always a device, so a computer can always reach it after a restart.
usb_host = true
# fm1-base's own fonts only draw its update, crash and safe-mode screens (h1 draws with its own stroke font):
# stored trimmed to each glyph's lit box and Huffman-coded, the same pixels in about 17.5 KB instead of 61 KB
font_trim = true
font_pack = true
# what a crash leaves behind is kept in flash (read with base/tools/fm1_remote.py crashes), with each stack's
# room at the crash; the stacks are painted at every start, so their unused bytes can be read (app.c's PERF)
crash_history = true
# USB audio: the FM-1 is a USB audio input beside its USB MIDI (one composite device), so a computer or a phone
# records it straight off the cable: the sound at MASTER. Nothing played back through it (usb_audio_out).
usb_audio_in = true
usb_audio_out = false
# firmware.json, for firmware hubs (base/docs/FIRMWARE-JSON.md): the build writes it from these
# the name people see on a listing; name above is "a22" (file names, id, USB names)
title = "A22"
tagline = "FM workstation for the FM-1"
repo = "https://github.com/abektes/a22"
licence = "MIT"
credits = "A22 is derived from h1 by Jake Handy, built on fm1-base by Charles Vestal and felucca-bsp from Felucca by Leo Kuroshita, Hügelton Instruments."
author = "A22"
description = "FM-first custom firmware for the M-VAVE FM-1 with 4-color vector graphics, 14 synth & drum engines (FM-4, Electric, Stack, Analog, Shaper, Wire, Haze, Mono, Kit, Perc, Wave, Chip, Cycle, Skins), 8 selectable FX, 4-track virtual tape, mixer, and Riff/Shake sequencers."
tags = ["synth", "fm", "groovebox", "sequencer"]
install = "https://github.com/abektes/a22#install"
screenshot = "docs/img/a22/fm4.png"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A22 — FM Workstation (M-VAVE FM-1 Simulator)</title>
  <style>
    :root {
      color-scheme: dark;
      --chassis: #e6e7ea;
      --chassis-edge: #c7c9cf;
      --chassis-dark: #181a1e;
      --bezel: #090a0d;
      --ink: #1e2128;
      --muted: #5a606e;
      --te-blue: #3b9eff;
      --te-green: #2cc96b;
      --te-white: #dfe4ec;
      --te-orange: #ff6b1a;
      --te-red: #ff2a4b;
      --focus: #ff6b1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-block-size: 100svh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: radial-gradient(circle at 50% 0%, #242832 0%, #101216 70%);
      color: #f0f2f6;
    }

    .app {
      width: min(1040px, 100%);
      display: grid;
      gap: 1rem;
    }

    header.bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.5rem 0.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.14em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .badge {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #252a34;
      color: var(--te-blue);
      border: 1px solid #353c4b;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .pill-btn {
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      padding: 0.45rem 0.85rem;
      min-block-size: 2.25rem;
      border-radius: 6px;
      border: 1px solid #3a404f;
      background: #222630;
      color: #eef1f6;
      cursor: pointer;
    }
    .pill-btn:hover { background: #2c3240; }
    .pill-btn.active {
      background: var(--te-orange);
      border-color: var(--te-orange);
      color: #0b0c0e;
      font-weight: 700;
    }
    .pill-btn:focus-visible,
    .hw-btn:focus-visible,
    .key:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* anodized aluminum hardware chassis */
    main.synth {
      background: linear-gradient(180deg, #eceef1 0%, #dcdde2 100%);
      color: var(--ink);
      border-radius: 18px;
      padding: 1.25rem;
      border: 1px solid #ffffff88;
      box-shadow: 0 28px 64px #00000099, inset 0 1px 0 #ffffff;
      display: grid;
      gap: 1.1rem;
    }

    .deck-top {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.25rem;
      align-items: start;
    }

    @media (max-width: 820px) {
      .deck-top { grid-template-columns: 1fr; }
    }

    /* 240x240 IPS OLED Screen Bezel */
    .screen-frame {
      background: var(--bezel);
      padding: 14px;
      border-radius: 14px;
      box-shadow: inset 0 2px 8px #000000cc, 0 2px 0 #ffffffaa;
      display: grid;
      justify-items: center;
      gap: 0.5rem;
    }

    canvas#lcd {
      width: 288px;
      height: 288px;
      image-rendering: pixelated;
      border-radius: 6px;
      background: #000;
      display: block;
    }

    .screen-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #8a94a8;
      letter-spacing: 0.08em;
    }

    /* Controls panel: Encoders + 14 Tactile Buttons */
    .controls-col {
      display: grid;
      gap: 1rem;
    }

    .encoders-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65rem;
    }

    @media (max-width: 560px) {
      .encoders-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .enc-card.is-empty { opacity: 0.35; }
    .enc-card {
      background: #f5f6f8;
      border: 1px solid #c9ccd4;
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      display: grid;
      gap: 0.35rem;
      box-shadow: 0 2px 4px #00000012;
    }

    .enc-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .enc-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-inline-end: 0.3rem;
      vertical-align: middle;
    }

    .enc-val {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Accessible brand-consistent native range sliders (separate WebKit / Firefox rules) */
    input[type="range"].op-slider {
      --slider-track-size: 0.45rem;
      --slider-thumb-size: 1.15rem;
      --slider-track-radius: 999px;
      --slider-thumb-radius: 50%;
      --slider-track-color: #9ea4b2;
      --slider-fill-color: var(--te-blue);
      --slider-thumb-color: var(--slider-fill-color);
      --slider-direction: to right;
      --attr-min: 0;
      --attr-max: 100;
      --control-value: 50;
      --slider-progress: calc(progress(var(--control-value), var(--attr-min), var(--attr-max)) * 100%);

      appearance: none;
      inline-size: 100%;
      block-size: 2rem;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    @supports not (opacity: progress(1, 0, 100)) {
      input[type="range"].op-slider {
        --slider-progress: calc((var(--control-value) - var(--attr-min)) / max(1, (var(--attr-max) - var(--attr-min))) * 100%);
      }
    }

    input[type="range"].op-slider::-webkit-slider-runnable-track {
      block-size: var(--slider-track-size);
      border: 0;
      border-radius: var(--slider-track-radius);
      background: linear-gradient(
        var(--slider-direction),
        var(--slider-fill-color) var(--slider-progress),
        var(--slider-track-color) var(--slider-progress)
      );
    }

    input[type="range"].op-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      margin-block-start: calc((var(--slider-track-size) - var(--slider-thumb-size)) / 2);
      border: 2px solid #181a1e;
      border-radius: var(--slider-thumb-radius);
      background: var(--slider-thumb-color);
      box-shadow: 0 2px 4px #00000033;
    }

    input[type="range"].op-slider::-moz-range-track {
      block-size: var(--slider-track-size);
      border: 0;
      border-radius: var(--slider-track-radius);
      background: var(--slider-track-color);
    }

    input[type="range"].op-slider::-moz-range-progress {
      block-size: var(--slider-track-size);
      border-radius: var(--slider-track-radius);
      background: var(--slider-fill-color);
    }

    input[type="range"].op-slider::-moz-range-thumb {
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      border: 2px solid #181a1e;
      border-radius: var(--slider-thumb-radius);
      background: var(--slider-thumb-color);
    }

    input[type="range"].op-slider:focus-visible {
      outline: 2px solid #181a1e;
      outline-offset: 4px;
    }

    .enc-k1 input.op-slider { --slider-fill-color: var(--te-blue); }
    .enc-k2 input.op-slider { --slider-fill-color: var(--te-green); }
    .enc-k3 input.op-slider { --slider-fill-color: #6b7280; --slider-thumb-color: #ffffff; }
    .enc-k4 input.op-slider { --slider-fill-color: var(--te-orange); }
    .enc-sys input.op-slider { --slider-fill-color: #363c48; }

    /* 14 Hardware Function Buttons */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.45rem;
    }

    .hw-btn {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      min-block-size: 2.65rem;
      padding: 0.35rem 0.25rem;
      border-radius: 8px;
      border: 1px solid #b5b9c4;
      background: linear-gradient(180deg, #fafbfc 0%, #e5e7ec 100%);
      color: #20242c;
      cursor: pointer;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 0.22rem;
      box-shadow: 0 2px 0 #b8bcc6;
      user-select: none;
    }

    .hw-btn:active,
    .hw-btn.down {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #b8bcc6;
      background: #d8dbe2;
    }

    .hw-btn .sub {
      font-size: 0.56rem;
      font-weight: 600;
      color: #687080;
    }

    .hw-btn .led {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c2c6d0;
    }
    .hw-btn.lit .led { background: var(--te-orange); box-shadow: 0 0 6px var(--te-orange); }
    .hw-btn.rec.lit .led { background: var(--te-red); box-shadow: 0 0 7px var(--te-red); }
    .hw-btn.play.lit .led { background: var(--te-green); box-shadow: 0 0 7px var(--te-green); }

    /* 27-Key Piano Keyboard (F3..G5) */
    .keyboard {
      position: relative;
      display: flex;
      height: 118px;
      background: #cfd2da;
      padding: 6px;
      border-radius: 12px;
      gap: 3px;
      user-select: none;
    }

    .key.white {
      flex: 1;
      min-inline-size: 24px;
      height: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #f1f2f5 100%);
      border: 1px solid #b4b8c2;
      border-radius: 0 0 7px 7px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6px;
      gap: 4px;
      font: inherit;
      font-size: 0.62rem;
      color: #6d7484;
      cursor: pointer;
    }
    .key.white.down { background: #d6e9ff; border-color: var(--te-blue); }

    .key.black {
      position: absolute;
      top: 6px;
      width: 3.4%;
      min-inline-size: 24px;
      height: 64px;
      transform: translateX(-50%);
      z-index: 2;
      background: linear-gradient(180deg, #2b2f38 0%, #15181d 100%);
      border: 1px solid #0b0c0f;
      border-radius: 0 0 6px 6px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 5px;
      gap: 3px;
      font: inherit;
      font-size: 0.56rem;
      color: #8f98ab;
      cursor: pointer;
    }
    .key.black.down { background: var(--te-blue); color: #0b0c0e; }

    .key .kled {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
    }
    .key.lit .kled { background: var(--te-orange); box-shadow: 0 0 6px var(--te-orange); }

    footer.hints {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.72rem;
      color: #9ba3b4;
      padding: 0 0.25rem;
    }
    kbd {
      background: #232833;
      border: 1px solid #394052;
      border-radius: 4px;
      padding: 0.08rem 0.32rem;
      font-size: 0.68rem;
      color: #e6ebf5;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <h1>
        <span>A22</span>
        <span class="badge">FM WORKSTATION</span>
        <span class="badge" id="status-live" aria-live="polite">LOADING WASM...</span>
      </h1>
      <div class="toolbar">
        <button type="button" class="pill-btn active" id="btn-audio">START AUDIO</button>
        <button type="button" class="pill-btn" id="btn-midi">CONNECT MIDI</button>
        <button type="button" class="pill-btn" id="btn-demo">DEMO CHORD</button>
      </div>
    </header>

    <main class="synth" aria-label="A22 Synthesizer Interface">
      <div class="deck-top">
        <div class="screen-frame">
          <canvas id="lcd" width="240" height="240" role="img" aria-label="A22 240 by 240 color display"></canvas>
          <div class="screen-meta">
            <span>240×240 IPS · 4-COLOR</span>
            <span id="fps-meta">60 FPS</span>
          </div>
        </div>

        <div class="controls-col">
          <section aria-label="Rotary Encoders">
            <div class="encoders-grid" id="encoders"></div>
          </section>
          <section aria-label="Function Buttons">
            <div class="buttons-grid" id="buttons"></div>
          </section>
        </div>
      </div>

      <section aria-label="27-Key Keyboard">
        <div class="keyboard" id="keyboard"></div>
      </section>
    </main>

    <footer class="hints">
      <span>Keys: <kbd>A</kbd>–<kbd>'</kbd> white, <kbd>W E R Y U O P [</kbd> black · <kbd>Z</kbd>/<kbd>X</kbd> Octave · <kbd>←</kbd>/<kbd>→</kbd> Engine · <kbd>↑</kbd>/<kbd>↓</kbd> Preset/FX · <kbd>Space</kbd> Play</span>
      <span>Shifts: <strong>EDIT+PRESET</strong> Track T1–T4 · <strong>EDIT+REC</strong> Cut · <strong>EDIT+PLAY</strong> Paste · <strong>SAVE+Key 1–8</strong> Snapshots</span>
    </footer>
  </div>

  <script>
    const BTN_SPEC = [
      { idx: 6,  label: "HOME", sub: "SYNTH" },
      { idx: 2,  label: "ENV",  sub: "ADSR/MOD" },
      { idx: 0,  label: "FX",   sub: "8-RACK" },
      { idx: 3,  label: "LFO",  sub: "MOD" },
      { idx: 1,  label: "SEL",  sub: "MIXER" },
      { idx: 8,  label: "ARP",  sub: "TOMB/END" },
      { idx: 9,  label: "SEQ",  sub: "4-TAPE" },
      { idx: 4,  label: "EDIT", sub: "SHIFT" },
      { idx: 5,  label: "GLO",  sub: "KEYS" },
      { idx: 7,  label: "SAVE", sub: "SNAP 1-8" },
      { idx: 12, label: "OCT-", sub: "IN BAR" },
      { idx: 13, label: "OCT+", sub: "OUT BAR" },
      { idx: 10, label: "PLAY", sub: "PASTE", cls: "play" },
      { idx: 11, label: "REC",  sub: "CUT", cls: "rec" },
    ];

    const ENC_SPEC = [
      { role: 3, cls: "enc-k1", dot: "#3b9eff", title: "K1" },
      { role: 4, cls: "enc-k2", dot: "#2cc96b", title: "K2" },
      { role: 5, cls: "enc-k3", dot: "#dfe4ec", title: "K3" },
      { role: 6, cls: "enc-k4", dot: "#ff6b1a", title: "K4" },
      { role: 2, cls: "enc-sys", dot: "#363c48", title: "ENGINE" },
      { role: 1, cls: "enc-sys", dot: "#363c48", title: "PRESET" },
      { role: 0, cls: "enc-sys", dot: "#363c48", title: "SELECT" },
      { role: -1, cls: "enc-sys", dot: "#ff6b1a", title: "MASTER" },
    ];

    /* 27 keys starting at F3 (MIDI 53..79) */
    const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const WHITE_QWERTY = ["KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ","KeyK","KeyL","Semicolon","Quote"];
    const BLACK_MAP = { KeyW: 1, KeyE: 3, KeyR: 5, KeyY: 8, KeyU: 10, KeyO: 13, KeyP: 15, BracketLeft: 17 };

    const statusEl = document.getElementById("status-live");
    const canvas = document.getElementById("lcd");
    const ctx = canvas.getContext("2d");
    const imgData = ctx.createImageData(240, 240);

    let wasm, mem, panelPtr, off, audioPtr, ctlPtr, btnIds, ledPos = [];
    let audioCtx, workletNode, audioRunning = false;
    let t0 = performance.now();
    let encEls = [], btnEls = new Map(), keyEls = [];

    function setStatus(txt) { statusEl.textContent = txt; }

    function syncSliderCss(el) {
      el.style.setProperty("--attr-min", el.min || "0");
      el.style.setProperty("--attr-max", el.max || "100");
      el.style.setProperty("--control-value", el.value);
    }

    function buildUI() {
      const encBox = document.getElementById("encoders");
      for (const spec of ENC_SPEC) {
        const card = document.createElement("div");
        card.className = "enc-card " + spec.cls;
        const id = "enc-range-" + spec.title.toLowerCase();
        card.innerHTML = `
          <div class="enc-head">
            <label for="${id}"><span class="enc-dot" style="background:${spec.dot}"></span><span class="ename">${spec.title}</span></label>
            <span class="enc-val">0</span>
          </div>
          <input id="${id}" class="op-slider" type="range" min="0" max="${spec.role === -1 ? 1023 : 100}" value="${spec.role === -1 ? 840 : 50}">
        `;
        const slider = card.querySelector("input");
        const nameEl = card.querySelector(".ename");
        const valEl  = card.querySelector(".enc-val");
        syncSliderCss(slider);
        slider.addEventListener("input", () => {
          syncSliderCss(slider);
          if (!wasm) return;
          const v = Number(slider.value);
          if (spec.role === -1) {
            new Int32Array(mem.buffer, panelPtr + off.master, 1)[0] = v;
            valEl.textContent = Math.round(v * 100 / 1023) + "%";
            slider.setAttribute("aria-valuetext", valEl.textContent);
          } else {
            wasm.rfm1_sim1_ctl_set(spec.role, v);
          }
        });
        encBox.appendChild(card);
        encEls.push({ spec, card, slider, nameEl, valEl });
      }

      const btnBox = document.getElementById("buttons");
      for (const b of BTN_SPEC) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "hw-btn " + (b.cls || "");
        el.setAttribute("aria-pressed", "false");
        el.innerHTML = `<span class="led"></span><span>${b.label}</span><span class="sub">${b.sub}</span>`;
        const press = (down) => {
          if (!wasm) return;
          const mask = 1 << btnIds[b.idx];
          const view = new Uint32Array(mem.buffer, panelPtr + off.buttons, 1);
          if (down) { view[0] |= mask; el.classList.add("down"); }
          else      { view[0] &= ~mask; el.classList.remove("down"); }
          el.setAttribute("aria-pressed", String(down));
          wasm.rfm1_tick((performance.now() - t0) >>> 0);
          ensureAudio();
        };
        el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); press(true); });
        el.addEventListener("pointerup", () => press(false));
        el.addEventListener("pointercancel", () => press(false));
        el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(true); } });
        el.addEventListener("keyup", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(false); } });
        btnBox.appendChild(el);
        btnEls.set(b.idx, el);
      }

      const kb = document.getElementById("keyboard");
      const whiteIdx = [];
      for (let k = 0; k < 27; k++) {
        const pc = (53 + k) % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(pc);
        if (!isBlack) whiteIdx.push(k);
      }
      const nWhite = whiteIdx.length;
      const setKey = (k, down) => {
        if (!wasm) return;
        const view = new Uint32Array(mem.buffer, panelPtr + off.keys, 1);
        if (down) { view[0] |= (1 << k); keyEls[k].classList.add("down"); }
        else      { view[0] &= ~(1 << k); keyEls[k].classList.remove("down"); }
        wasm.rfm1_tick((performance.now() - t0) >>> 0);
        ensureAudio();
      };

      let wSeen = 0;
      for (let k = 0; k < 27; k++) {
        const midi = 53 + k;
        const pc = midi % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(pc);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "key " + (isBlack ? "black" : "white");
        btn.setAttribute("aria-label", NOTE_NAMES[pc] + Math.floor(midi / 12 - 1));
        btn.innerHTML = `<span class="kled"></span><span>${NOTE_NAMES[pc]}</span>`;
        if (isBlack) {
          btn.style.left = `calc(6px + ${(wSeen / nWhite) * 100}% - ${(wSeen / nWhite) * 12}px)`;
        } else {
          wSeen++;
        }
        btn.addEventListener("pointerdown", (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); setKey(k, true); });
        btn.addEventListener("pointerup", () => setKey(k, false));
        btn.addEventListener("pointercancel", () => setKey(k, false));
        kb.appendChild(btn);
        keyEls[k] = btn;
      }

      /* QWERTY piano + quick shortcuts */
      const whiteToKey = [0, 2, 4, 6, 7, 9, 11, 12, 14, 16, 18];
      const downCodes = new Set();
      window.addEventListener("keydown", (e) => {
        if (e.repeat || e.target.tagName === "INPUT") return;
        const wi = WHITE_QWERTY.indexOf(e.code);
        if (wi >= 0) { downCodes.add(e.code); setKey(whiteToKey[wi], true); return; }
        if (BLACK_MAP[e.code] !== undefined) { downCodes.add(e.code); setKey(BLACK_MAP[e.code], true); return; }
        if (e.code === "KeyZ") tapBtn(12);
        else if (e.code === "KeyX") tapBtn(13);
        else if (e.code === "ArrowRight") nudgeEnc(2, 1);
        else if (e.code === "ArrowLeft") nudgeEnc(2, -1);
        else if (e.code === "ArrowUp") nudgeEnc(1, 1);
        else if (e.code === "ArrowDown") nudgeEnc(1, -1);
        else if (e.code === "Space") { e.preventDefault(); tapBtn(10); }
      });
      window.addEventListener("keyup", (e) => {
        if (!downCodes.has(e.code)) return;
        downCodes.delete(e.code);
        const wi = WHITE_QWERTY.indexOf(e.code);
        if (wi >= 0) setKey(whiteToKey[wi], false);
        else if (BLACK_MAP[e.code] !== undefined) setKey(BLACK_MAP[e.code], false);
      });
    }

    function tapBtn(idx) {
      if (!wasm) return;
      ensureAudio();
      const view = new Uint32Array(mem.buffer, panelPtr + off.buttons_tap, 1);
      view[0] |= (1 << btnIds[idx]);
    }

    function nudgeEnc(role, delta) {
      if (!wasm) return;
      ensureAudio();
      const encId = new Uint8Array(mem.buffer, panelPtr + off.enc_id, 7)[role];
      new Int32Array(mem.buffer, panelPtr + off.enc, 7)[encId] += delta;
    }

    function pumpAudio(frames) {
      if (!wasm || !workletNode) return;
      let left = frames;
      while (left > 0) {
        const n = Math.min(left, 512);
        wasm.rfm1_audio(audioPtr, n);
        const pcm = new Int16Array(mem.buffer, audioPtr, n * 2);
        const l = new Float32Array(n);
        const r = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          l[i] = pcm[i * 2] / 32768;
          r[i] = pcm[i * 2 + 1] / 32768;
        }
        workletNode.port.postMessage({ l, r }, [l.buffer, r.buffer]);
        left -= n;
      }
    }

    async function ensureAudio() {
      if (audioRunning) {
        if (audioCtx && audioCtx.state === "suspended") await audioCtx.resume();
        return;
      }
      audioRunning = true;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
      await audioCtx.audioWorklet.addModule("./audio-worklet.js");
      workletNode = new AudioWorkletNode(audioCtx, "a22-audio-sink", { outputChannelCount: [2] });
      workletNode.port.onmessage = (e) => pumpAudio(e.data);
      workletNode.connect(audioCtx.destination);
      pumpAudio(1024);
      document.getElementById("btn-audio").textContent = "AUDIO ON";
      setStatus("A22 LIVE · 44.1 kHz STEREO");
    }

    function readCstr(ptr, max) {
      const bytes = new Uint8Array(mem.buffer, ptr, max);
      let s = "";
      for (let i = 0; i < max && bytes[i]; i++) s += String.fromCharCode(bytes[i]);
      return s;
    }

    function syncControlsFromWasm() {
      for (const item of encEls) {
        if (item.spec.role === -1) {
          const mv = new Int32Array(mem.buffer, panelPtr + off.master, 1)[0];
          item.valEl.textContent = Math.round(mv * 100 / 1023) + "%";
          continue;
        }
        wasm.rfm1_sim1_ctl(item.spec.role, ctlPtr);
        const iv = new Int32Array(mem.buffer, ctlPtr, 3);
        const nm = readCstr(ctlPtr + 12, 32);
        const tx = readCstr(ctlPtr + 44, 32);
        if (item.nameEl.textContent !== nm) item.nameEl.textContent = nm;
        item.card.classList.toggle("is-empty", !nm);         /* a column the page leaves empty (SHAKE 2/2) */
        item.slider.disabled = !nm;
        if (item.valEl.textContent !== tx) item.valEl.textContent = tx;
        if (document.activeElement !== item.slider) {
          item.slider.min = String(iv[1]);
          item.slider.max = String(iv[2]);
          item.slider.value = String(iv[0]);
          syncSliderCss(item.slider);
        }
        item.slider.setAttribute("aria-valuetext", `${nm} ${tx}`);
      }
    }

    function drawLcdAndLeds() {
      const lcd = new Uint16Array(mem.buffer, panelPtr + off.lcd, 240 * 240);
      const dst = imgData.data;
      for (let i = 0; i < 240 * 240; i++) {
        const be = lcd[i];
        const px = ((be & 0xFF) << 8) | (be >> 8);
        const r = ((px >> 11) & 31) * 255 / 31;
        const g = ((px >> 5) & 63) * 255 / 63;
        const b = (px & 31) * 255 / 31;
        const o = i * 4;
        dst[o] = r; dst[o + 1] = g; dst[o + 2] = b; dst[o + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);

      const led = new Uint8Array(mem.buffer, panelPtr + off.led, 44);
      for (const [idx, el] of btnEls.entries()) {
        const q = ledPos[idx];
        el.classList.toggle("lit", q !== 0xFF && led[q] > 0);
      }
      for (let k = 0; k < 27; k++) {
        const q = ledPos[14 + k];
        keyEls[k].classList.toggle("lit", q !== 0xFF && led[q] > 0);
      }
    }

    async function boot() {
      buildUI();
      const resp = await fetch("../dist/a22.rfm1");
      const bytes = await resp.arrayBuffer();
      const { instance } = await WebAssembly.instantiate(bytes, {});
      wasm = instance.exports;
      mem = wasm.memory;

      off = {
        keys: wasm.rfm1_layout(1),
        buttons: wasm.rfm1_layout(2),
        keys_tap: wasm.rfm1_layout(3),
        buttons_tap: wasm.rfm1_layout(4),
        enc: wasm.rfm1_layout(5),
        master: wasm.rfm1_layout(6),
        led: wasm.rfm1_layout(9),
        lcd: wasm.rfm1_layout(11),
        btn_id: wasm.rfm1_layout(13),
        enc_id: wasm.rfm1_layout(14),
        core_panel: wasm.rfm1_layout(30),
        core_keymap: wasm.rfm1_layout(31),
      };
      const corePtr = wasm.rfm1_get(6);
      panelPtr = new Uint32Array(mem.buffer, corePtr + off.core_panel, 1)[0];
      const keymapPtr = new Uint32Array(mem.buffer, corePtr + off.core_keymap, 1)[0];
      audioPtr = wasm.rfm1_alloc(512 * 4);
      ctlPtr   = wasm.rfm1_alloc(96);

      wasm.rfm1_init(0);
      btnIds = Array.from(new Uint8Array(mem.buffer, panelPtr + off.btn_id, 14));
      const keymap = new Int8Array(mem.buffer, keymapPtr, 6 * 11);
      for (let i = 0; i < 41; i++) {
        const id = i < 14 ? btnIds[i] : 14 + (i - 14);
        let q = 0xFF;
        for (let r = 1; r <= 4; r++)
          for (let c = 0; c < 11; c++)
            if (keymap[r * 11 + c] === id) q = (c << 2) | (r - 1);
        ledPos[i] = q;
      }

      setStatus("READY — CLICK START AUDIO OR PLAY A KEY");

      let lastFpsT = performance.now(), frames = 0;
      function loop(now) {
        wasm.rfm1_tick((now - t0) >>> 0);
        wasm.rfm1_frame();
        drawLcdAndLeds();
        syncControlsFromWasm();
        frames++;
        if (now - lastFpsT >= 500) {
          document.getElementById("fps-meta").textContent = Math.round(frames * 1000 / (now - lastFpsT)) + " FPS";
          frames = 0; lastFpsT = now;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    document.getElementById("btn-audio").addEventListener("click", ensureAudio);
    document.getElementById("btn-demo").addEventListener("click", async () => {
      await ensureAudio();
      const notes = [60, 64, 67, 71];
      notes.forEach((n, i) => {
        setTimeout(() => wasm.rfm1_midi_in(0x09 | (0x90 << 8) | (n << 16) | (108 << 24)), i * 55);
        setTimeout(() => wasm.rfm1_midi_in(0x08 | (0x80 << 8) | (n << 16)), 950 + i * 35);
      });
    });

    document.getElementById("btn-midi").addEventListener("click", async () => {
      if (!navigator.requestMIDIAccess) { setStatus("WEBMIDI NOT SUPPORTED IN THIS BROWSER"); return; }
      try {
        await ensureAudio();
        const midi = await navigator.requestMIDIAccess();
        let count = 0;
        for (const inp of midi.inputs.values()) {
          inp.onmidimessage = (ev) => {
            const [s, d1 = 0, d2 = 0] = ev.data;
            const cin = (s >> 4) & 0xF;
            wasm.rfm1_midi_in(cin | (s << 8) | (d1 << 16) | (d2 << 24));
          };
          count++;
        }
        setStatus(count ? `MIDI CONNECTED (${count} PORT${count > 1 ? "S" : ""})` : "NO MIDI DEVICES FOUND");
      } catch (err) {
        setStatus("MIDI PERMISSION DENIED");
      }
    });

    boot().catch((e) => setStatus("LOAD ERROR: " + e.message));
  </script>
</body>
</html>
